import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'com.gradleup.shadow' version '9.4.3'
	id 'maven-publish'
	id 'eclipse'
	id 'java'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-source', '' + 21, '-target', '' + 21]
}

compileTestJava.options.encoding = 'UTF-8'
compileJava.options.encoding = 'UTF-8'

repositories {
	mavenCentral()

	// Paper
	maven {
		url 'https://repo.papermc.io/repository/maven-public/'
	}

	// Skript
	maven {
		url 'https://repo.skriptlang.org/releases'
	}

}

dependencies {

	//Paper/Bukkit (26.1 is the oldest target, later 26.x versions stay compatible)
	implementation (group: 'io.papermc.paper', name: 'paper-api', version: '26.1.2.build.74-stable')

	//Skript
	implementation (group: 'com.github.SkriptLang', name: 'Skript', version: '2.16.2') {
		transitive = false
	}

	shadow group: 'org.bstats', name: 'bstats-bukkit', version: '3.2.1'

	shadow (group: 'org.json', name: 'json', version: '20251224')

}

processResources {
	filter ReplaceTokens, tokens: ["version": project.property("version")]
	from ('lang') {
			include '**/*'
			into 'lang/'
	}
}

shadowJar {
	configurations = [project.configurations.shadow]
	dependencies {
		include(dependency('org.bstats:bstats-bukkit'))
		include(dependency('org.bstats:bstats-base'))
	}
	relocate 'org.bstats', 'com.skquery.skquery.bstats'
	archiveVersion = version
	archiveFileName = project.name + "-" + version + ".jar"
	minimize()
}
